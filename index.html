<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaelle Book Store | Home</title>
    <link rel="icon" type="image/png" href="./assets/Igire_Rwanda_Logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800">
    <!-- Shared navigation -->
    <header class="bg-white shadow-sm">
      <nav class="mx-auto flex w-full max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
        <a href="./index.html" class="flex items-center gap-2 text-xl font-bold text-indigo-600">
          <img src="./assets/Igire_Rwanda_Logo.png" alt="Igire Rwanda Logo" class="h-10 w-auto" />
          <span>Gaelle Book Store</span>
        </a>
        <button
          id="menu-toggle"
          class="rounded-md border border-slate-300 px-3 py-2 text-sm font-medium md:hidden"
          aria-label="Toggle navigation menu"
          aria-expanded="false"
        >
          Menu
        </button>
        <ul id="nav-menu" class="hidden gap-6 text-sm font-medium md:flex">
          <li><a data-nav-link="home" href="./index.html" class="nav-link text-slate-600 hover:text-indigo-600">Home</a></li>
          <li><a data-nav-link="favorites" href="./favorites.html" class="nav-link text-slate-600 hover:text-indigo-600">Favorites (<span data-favorites-count>0</span>)</a></li>
          <li><a data-nav-link="about" href="./about.html" class="nav-link text-slate-600 hover:text-indigo-600">About</a></li>
        </ul>
      </nav>
      <ul id="mobile-menu" class="hidden space-y-2 border-t border-slate-200 px-4 py-4 text-sm font-medium md:hidden">
        <li><a data-nav-link="home" href="./index.html" class="nav-link block text-slate-600 hover:text-indigo-600">Home</a></li>
        <li><a data-nav-link="favorites" href="./favorites.html" class="nav-link block text-slate-600 hover:text-indigo-600">Favorites (<span data-favorites-count>0</span>)</a></li>
        <li><a data-nav-link="about" href="./about.html" class="nav-link block text-slate-600 hover:text-indigo-600">About</a></li>
      </ul>
    </header>

    <main>
      <!-- Hero section -->
      <section class="bg-indigo-600 px-4 py-16 text-white sm:px-6 lg:px-8">
        <div class="mx-auto max-w-7xl">
          <h1 class="text-3xl font-bold sm:text-4xl lg:text-5xl">Discover your next favorite book</h1>
          <p class="mt-4 max-w-2xl text-indigo-100">
            Search by title, browse results, and save books you love to your favorites list.
          </p>
        </div>
      </section>

      <!-- Search form and API-rendered book results -->
      <section class="mx-auto w-full max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
        <form id="search-form" class="flex flex-col gap-3 sm:flex-row" aria-label="Search books by title">
          <label for="search-input" class="sr-only">Search for a book title</label>
          <input
            id="search-input"
            name="search"
            type="text"
            placeholder="Search books by title..."
            class="flex-1 rounded-md border border-slate-300 px-4 py-3 text-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"  
          required/>
          <button
            type="submit"
            class="rounded-md bg-indigo-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-indigo-700"
          >
            Search
          </button>
        </form>

        <!-- Loading, error, and empty messages appear here -->
        <div id="status-container" class="mt-6" aria-live="polite"></div>

        <!-- Book cards are rendered here by js/main.js -->
        <section id="books-grid" class="mt-8 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4" aria-label="Book results"></section>
      </section>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 bg-white py-6">
      <div class="mx-auto flex w-full max-w-7xl items-center justify-between px-4 text-sm text-slate-500 sm:px-6 lg:px-8">
        <p>Gaelle Book Store</p>
        <p>Built with Open Library API</p>
      </div>
    </footer>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
